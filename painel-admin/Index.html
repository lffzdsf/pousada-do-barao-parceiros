<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--wine:#532b2f;--cream:#f5f1e9;--ink:#26221e}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:var(--ink);background:var(--cream)}header{padding:24px 5vw;background:var(--wine);color:#fff}main{padding:28px 5vw;max-width:1200px;margin:auto}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--wine);color:white}.card{background:#fff;border:1px solid #ddd4c7;border-radius:12px;padding:16px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.muted{color:#706860}.actions{display:flex;gap:8px;align-items:center}.actions button{background:#eee8de}.modal,.login-screen{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.open,.login-screen.open{display:flex}.login-screen{z-index:10;background:var(--cream)}.login-box{background:#fff;border:1px solid #ddd4c7;border-radius:16px;padding:28px;width:min(420px,100%);box-shadow:0 18px 60px #0002}.login-box h1{color:var(--wine);margin-top:0}.login-box button{width:100%;margin-top:14px}.error{color:#a52020;min-height:20px;margin-top:10px}.panel{background:#fff;border-radius:14px;padding:22px;width:min(720px,100%);max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:700}input,textarea{width:100%;padding:10px;border:1px solid #cfc6b9;border-radius:7px;font:inherit}textarea{min-height:85px}.wide{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}#app{display:none}@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="login-screen open" id="loginScreen"><form class="login-box" onsubmit="enter(event)"><h1>Painel de parceiros</h1><p class="muted">Pousada do Barão</p><label>Senha administrativa<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" id="loginButton">Entrar</button><div class="error" id="loginError"></div></form></div>
<div id="app"><header><h1>Parceiros</h1><div>Cadastro e benefícios da Pousada do Barão</div></header><main><div class="toolbar"><div><strong id="count">Carregando…</strong><div class="muted">Alterações salvas na planilha aparecem no site público.</div></div><div><button onclick="exitPanel()">Sair</button> <button class="primary" onclick="openForm()">Novo parceiro</button></div></div><section id="list"></section></main></div>
<div class="modal" id="modal"><form class="panel" onsubmit="save(event)"><h2 id="formTitle">Novo parceiro</h2><input type="hidden" name="ID"><div class="grid"><label>Nome<input name="Nome" required></label><label>Categoria<input name="Categoria"></label><label>Benefício<input name="Benefício" required></label><label>Ordem<input name="Ordem" type="number" min="1"></label><label class="wide">Descrição<textarea name="Descrição"></textarea></label><label>Instagram<input name="Instagram"></label><label>WhatsApp<input name="WhatsApp"></label><label class="wide">Logo (URL)<input name="Logo (URL)" type="url"></label><label><span>Ativo</span><input name="Ativo" type="checkbox" checked></label></div><div class="foot"><button type="button" onclick="closeForm()">Cancelar</button><button class="primary">Salvar</button></div></form></div>
<script>
let items=[],token=sessionStorage.getItem('partnerAdminToken')||'';const list=document.querySelector('#list'),modal=document.querySelector('#modal'),form=modal.querySelector('form');
function enter(e){e.preventDefault();const btn=document.querySelector('#loginButton'),error=document.querySelector('#loginError');btn.disabled=true;error.textContent='';google.script.run.withSuccessHandler(r=>{token=r.token;sessionStorage.setItem('partnerAdminToken',token);showApp();btn.disabled=false}).withFailureHandler(err=>{error.textContent=err.message||err;btn.disabled=false}).login(document.querySelector('#password').value)}
function showApp(){document.querySelector('#loginScreen').classList.remove('open');document.querySelector('#app').style.display='block';load()}
function showLogin(message=''){sessionStorage.removeItem('partnerAdminToken');token='';document.querySelector('#app').style.display='none';document.querySelector('#loginScreen').classList.add('open');document.querySelector('#loginError').textContent=message}
function exitPanel(){google.script.run.logout(token);showLogin()}
function load(){google.script.run.withSuccessHandler(data=>{items=data;render()}).withFailureHandler(fail).listPartners(token)}
function render(){document.querySelector('#count').textContent=`${items.length} parceiro(s)`;list.innerHTML=items.map(p=>`<article class="card"><div><strong>${esc(p.Nome)}</strong><div class="muted">${esc(p.Categoria||'Sem categoria')} · ${esc(p['Benefício']||'Sem benefício')} · ${p.Ativo?'Ativo':'Inativo'}</div></div><div class="actions"><button onclick='edit(${JSON.stringify(p.ID)})'>Editar</button><button onclick='removeItem(${JSON.stringify(p.ID)})'>Excluir</button></div></article>`).join('')||'<p>Nenhum parceiro cadastrado.</p>'}
function openForm(p={}){form.reset();for(const [k,v] of Object.entries(p)){const el=form.elements[k];if(el)el.type==='checkbox'?el.checked=!!v:el.value=v??''}if(!p.ID)form.elements.Ativo.checked=true;document.querySelector('#formTitle').textContent=p.ID?'Editar parceiro':'Novo parceiro';modal.classList.add('open')}
function closeForm(){modal.classList.remove('open')}function edit(id){openForm(items.find(x=>x.ID===id))}
function save(e){e.preventDefault();const d=Object.fromEntries(new FormData(form));d.Ativo=form.elements.Ativo.checked;google.script.run.withSuccessHandler(()=>{closeForm();load()}).withFailureHandler(fail).savePartner(token,d)}
function removeItem(id){if(confirm('Excluir este parceiro?'))google.script.run.withSuccessHandler(load).withFailureHandler(fail).deletePartner(token,id)}
function fail(e){const message=e.message||String(e);if(message.includes('Sessão expirada'))showLogin(message);else alert(message)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(token)showApp();
</script></body></html>
