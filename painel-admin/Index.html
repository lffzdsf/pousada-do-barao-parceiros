<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--wine:#532b2f;--cream:#f5f1e9;--ink:#26221e}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;color:var(--ink);background:var(--cream)}header{padding:24px 5vw;background:var(--wine);color:#fff}main{padding:28px 5vw;max-width:1200px;margin:auto}.toolbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--wine);color:white}.card{background:#fff;border:1px solid #ddd4c7;border-radius:12px;padding:16px;margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.muted{color:#706860}.actions{display:flex;gap:8px;align-items:center}.actions button{background:#eee8de}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.panel{background:#fff;border-radius:14px;padding:22px;width:min(720px,100%);max-height:92vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-weight:700}input,textarea{width:100%;padding:10px;border:1px solid #cfc6b9;border-radius:7px;font:inherit}textarea{min-height:85px}.wide{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:680px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><header><h1>Parceiros</h1><div>Cadastro e benefícios da Pousada do Barão</div></header><main><div class="toolbar"><div><strong id="count">Carregando…</strong><div class="muted">Alterações salvas na planilha aparecem no site público.</div></div><button class="primary" onclick="openForm()">Novo parceiro</button></div><section id="list"></section></main>
<div class="modal" id="modal"><form class="panel" onsubmit="save(event)"><h2 id="formTitle">Novo parceiro</h2><input type="hidden" name="ID"><div class="grid"><label>Nome<input name="Nome" required></label><label>Categoria<input name="Categoria"></label><label>Benefício<input name="Benefício" required></label><label>Ordem<input name="Ordem" type="number" min="1"></label><label class="wide">Descrição<textarea name="Descrição"></textarea></label><label>Instagram<input name="Instagram"></label><label>WhatsApp<input name="WhatsApp"></label><label class="wide">Logo (URL)<input name="Logo (URL)" type="url"></label><label><span>Ativo</span><input name="Ativo" type="checkbox" checked></label></div><div class="foot"><button type="button" onclick="closeForm()">Cancelar</button><button class="primary">Salvar</button></div></form></div>
<script>
let items=[];const list=document.querySelector('#list'),modal=document.querySelector('#modal'),form=modal.querySelector('form');
function load(){google.script.run.withSuccessHandler(data=>{items=data;render()}).withFailureHandler(fail).listPartners()}
function render(){document.querySelector('#count').textContent=`${items.length} parceiro(s)`;list.innerHTML=items.map(p=>`<article class="card"><div><strong>${esc(p.Nome)}</strong><div class="muted">${esc(p.Categoria||'Sem categoria')} · ${esc(p['Benefício']||'Sem benefício')} · ${p.Ativo?'Ativo':'Inativo'}</div></div><div class="actions"><button onclick='edit(${JSON.stringify(p.ID)})'>Editar</button><button onclick='removeItem(${JSON.stringify(p.ID)})'>Excluir</button></div></article>`).join('')||'<p>Nenhum parceiro cadastrado.</p>'}
function openForm(p={}){form.reset();for(const [k,v] of Object.entries(p)){const el=form.elements[k];if(el) el.type==='checkbox'?el.checked=!!v:el.value=v??''}if(!p.ID)form.elements.Ativo.checked=true;document.querySelector('#formTitle').textContent=p.ID?'Editar parceiro':'Novo parceiro';modal.classList.add('open')}
function closeForm(){modal.classList.remove('open')}function edit(id){openForm(items.find(x=>x.ID===id))}
function save(e){e.preventDefault();const d=Object.fromEntries(new FormData(form));d.Ativo=form.elements.Ativo.checked;google.script.run.withSuccessHandler(()=>{closeForm();load()}).withFailureHandler(fail).savePartner(d)}
function removeItem(id){if(confirm('Excluir este parceiro?'))google.script.run.withSuccessHandler(load).withFailureHandler(fail).deletePartner(id)}
function fail(e){alert(e.message||e)}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();
</script></body></html>
